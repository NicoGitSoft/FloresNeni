services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - neni_postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - neni_redis_data:/data


volumes:

  neni_postgres_data:
  neni_redis_data:
