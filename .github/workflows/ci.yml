name: CI

on:
  push:
    branches: [v2, v3]
  pull_request:
    branches: [v2, v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: neni
          POSTGRES_USER: neni
          POSTGRES_PASSWORD: neni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neni -d neni"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://neni:neni@localhost:5432/neni
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:4321
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:4321,http://localhost:9000
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      COOKIE_SECRET: ci-only-cookie-secret-not-for-production
      PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm 10.34.6
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Node and pnpm versions
        run: |
          node --version
          pnpm --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 22)) process.exit(1)'
          test "$(pnpm --version)" = "10.34.6"

      - name: Install frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Smoke test clean bootstrap twice
        run: |
          pnpm --filter @dtc/backend exec medusa db:migrate
          pnpm neni:bootstrap
          pnpm --filter @dtc/backend exec medusa exec ./src/scripts/verify-neni-bootstrap.ts
          NENI_INVENTORY_DEMO_EXPECT=absent pnpm --filter @dtc/backend exec medusa exec ./src/scripts/verify-inventory-bom-demo.ts
          pnpm neni:bootstrap:inventory-demo
          pnpm --filter @dtc/backend exec medusa exec ./src/scripts/verify-inventory-bom-demo.ts
          pnpm neni:bootstrap
          pnpm --filter @dtc/backend exec medusa exec ./src/scripts/verify-neni-bootstrap.ts
          pnpm neni:bootstrap:inventory-demo
          pnpm --filter @dtc/backend exec medusa exec ./src/scripts/verify-inventory-bom-demo.ts

      - name: Check PR diff formatting
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check "HEAD^" HEAD
          fi

      - name: Run checkout unit tests
        run: pnpm neni:test:checkout

      - name: Run inventory and BOM unit tests
        run: pnpm neni:test:inventory

      - name: Run Neni checks
        run: pnpm neni:check
